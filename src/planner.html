<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>bullet.ly</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Patrick+Hand&family=Kalam:wght@400;700&family=Gaegu:wght@400;700&family=Nanum+Pen+Script&family=Shadows+Into+Light&family=Reenie+Beanie&family=Indie+Flower&family=Handlee&family=Gochi+Hand&family=Architects+Daughter&family=Covered+By+Your+Grace&family=Just+Another+Hand&family=Schoolbell&family=Short+Stack&family=Sue+Ellen+Francisco&family=Over+the+Rainbow&family=Delicious+Handrawn&family=Mynerve&family=Nothing+You+Could+Do&family=Homemade+Apple&family=Gloria+Hallelujah&family=Quicksand:wght@500;700&family=Nunito:wght@500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="planner.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">bullet.ly</div>
    <button id="today-btn" class="pill">Today</button>
    <button id="prev-btn" class="icon-btn" aria-label="Previous week">‹</button>
    <button id="next-btn" class="icon-btn" aria-label="Next week">›</button>
    <h1 id="title"></h1>
    <span class="grow"></span>
    <span id="sync-status" class="sync"></span>
    <button id="refresh-btn" class="icon-btn" title="Sync now" hidden>↻</button>
    <button id="new-event-btn" class="pill">＋ Event</button>
    <button id="google-btn" class="pill">Connect Google</button>
    <button id="font-btn" class="pill">Style</button>
    <button id="sticker-toggle" class="pill">✿ Decorate</button>
  </header>

  <div class="font-panel card" id="font-panel" hidden>
    <h2>Style</h2>
    <div class="pm-label">Accent color</div>
    <div class="sw-row" id="accent-row"></div>
    <label style="margin-top:12px">Font for text you add
      <select id="hand-font"></select>
    </label>
    <button id="font-upload-btn" class="pill">Upload my own font…</button>
    <input type="file" id="font-file" accept=".ttf,.otf,.woff,.woff2" hidden>
    <p class="muted">Fonts only change text you add yourself (text notes). Everything else uses Inter.</p>
  </div>

  <div class="google-panel card" id="google-panel" hidden></div>

  <div class="layout">
    <aside class="left">
      <section class="card">
        <div id="mini-cal"></div>
      </section>
      <section class="card">
        <h2>My calendars</h2>
        <ul id="cal-list" class="cal-list"></ul>
      </section>
      <section class="card" id="other-cals" hidden>
        <h2>Other calendars</h2>
        <ul id="cal-list-other" class="cal-list"></ul>
      </section>
    </aside>

    <main class="stage">
      <div class="surface-area">
        <!-- week spread -->
        <section class="spread" id="spread">
          <div class="week-head" id="week-head"></div>
          <div class="todo-row" id="todo-row"></div>
          <div class="allday-row" id="allday-row"></div>
          <div class="timeline" id="timeline"></div>
          <svg class="ink-layer" viewBox="0 0 1000 1000" preserveAspectRatio="none"></svg>
          <div class="sticker-layer"></div>
        </section>

        <!-- free-style page: same size as the weekly spread -->
        <section class="pframe" id="pframe" hidden>
          <div class="pcanvas paper-grid" id="pcanvas">
            <svg class="ink-layer" viewBox="0 0 1000 1000" preserveAspectRatio="none"></svg>
            <div class="sticker-layer"></div>
          </div>
        </section>
      </div>
      <nav class="page-tabs" id="page-tabs" aria-label="Pages"></nav>
    </main>

    <aside class="right">
      <section class="card">
        <h2>Weekly goals</h2>
        <ul id="goals" class="goals"></ul>
      </section>
      <section class="card">
        <h2>Habit tracker</h2>
        <div id="habits"></div>
      </section>
    </aside>
  </div>

  <div class="page-menu card" id="page-menu" hidden></div>

  <div class="event-card" id="event-card" hidden></div>
  <form class="event-form" id="event-form" hidden onsubmit="return false"></form>
  <div class="ctx-menu" id="ctx-menu" hidden></div>
  <div class="toast" id="toast" hidden></div>

  <div class="dock" id="dock" hidden>
    <div class="emoji-panel card" id="emoji-panel" hidden></div>
    <div class="block-panel card" id="block-panel" hidden></div>
    <div class="subbar" id="subbar" hidden>
      <div id="textbar" hidden></div>
      <div id="itembar" hidden></div>
      <div id="drawbar" hidden></div>
      <div id="fillbar" hidden></div>
    </div>
    <div class="tray" id="tray"></div>
  </div>
  <input type="file" id="photo-file" accept="image/*" multiple hidden>

  <script src="mock-data.js"></script>
  <script src="google.js"></script>
  <script src="planner.js"></script>
</body>
</html>
