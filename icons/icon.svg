<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <clipPath id="card"><rect x="8" y="10" width="112" height="110" rx="22"/></clipPath>
    <pattern id="grid" width="14" height="14" patternUnits="userSpaceOnUse" x="8" y="10">
      <path d="M14 0H0V14" fill="none" stroke="#e3e3d8" stroke-width="1.6"/>
    </pattern>
  </defs>
  <rect x="8" y="10" width="112" height="110" rx="22" fill="#fdfcf8"/>
  <g clip-path="url(#card)">
    <rect width="128" height="128" fill="url(#grid)"/>
    <rect x="8" y="10" width="112" height="34" fill="#d96c7a"/>
  </g>
  <rect x="8" y="10" width="112" height="110" rx="22" fill="none" stroke="#2b2b2b" stroke-width="4"/>
  <!-- binder rings -->
  <rect x="34" y="3" width="9" height="20" rx="4.5" fill="#fdfcf8" stroke="#2b2b2b" stroke-width="3.5"/>
  <rect x="85" y="3" width="9" height="20" rx="4.5" fill="#fdfcf8" stroke="#2b2b2b" stroke-width="3.5"/>
  <!-- bullet-journal rows: a checked bullet, then open bullets -->
  <path d="M30 63l6 6 11-13" fill="none" stroke="#d96c7a" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M58 63h40" stroke="#2b2b2b" stroke-width="5" stroke-linecap="round"/>
  <circle cx="38" cy="84" r="4.5" fill="#2b2b2b"/>
  <path d="M58 84h30" stroke="#2b2b2b" stroke-width="5" stroke-linecap="round"/>
  <circle cx="38" cy="102" r="4.5" fill="#2b2b2b"/>
  <path d="M58 102h36" stroke="#2b2b2b" stroke-width="5" stroke-linecap="round"/>
</svg>
